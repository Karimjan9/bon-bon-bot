<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bon Bon Mini App</title>
    <link rel="stylesheet" href="/static/styles.css?v=auth-login-page-1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header" aria-label="Mini app yuqori menyusi">
        <a class="brand" href="/" aria-label="Bon Bon bosh sahifa">
          <img class="brand-logo" src="/static/assets/bon-bon-logo.svg" alt="Bon Bon" />
        </a>

        <div class="header-actions">
          <button class="icon-button" id="language-toggle" type="button" aria-label="Tilni o'zgartirish">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h8M9 4v3m5 0H4m2 0c.8 2.8 2.4 5.1 5 7m-3.5 0c2.1-1.4 3.7-3.6 4.5-7M13 20l4-9 4 9m-6.7-3h5.4" />
            </svg>
            <span id="language-label">UZ</span>
          </button>
          <button class="icon-button" id="search-toggle" type="button" aria-label="Qidirish">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
            </svg>
          </button>
          <button
            class="icon-button profile-button"
            id="user-login-toggle"
            type="button"
            aria-controls="admin-panel"
            aria-label="Profil va admin kirish"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" />
            </svg>
            <span class="profile-name" id="profile-name">Login</span>
          </button>
        </div>
      </header>

      <form class="search-bar is-hidden" id="search-bar" role="search">
        <input id="product-search" type="search" placeholder="Mahsulot qidirish" autocomplete="off" />
      </form>

      <section class="menu-section" id="menu-section" aria-label="Menu">
        <div class="menu-toolbar">
          <button class="menu-arrow-button" id="menu-category-prev" type="button" aria-label="Oldingi category">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <div class="menu-category-window">
            <div class="menu-category-row" id="menu-categories"></div>
          </div>
          <button class="menu-arrow-button" id="menu-category-next" type="button" aria-label="Keyingi category">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
        <h1 class="menu-title" id="menu-title">Barchasi</h1>
        <div class="menu-grid" id="menu-grid"></div>
      </section>

      <div class="menu-modal is-hidden" id="menu-modal" role="dialog" aria-modal="true" aria-label="Menu item">
        <div class="menu-modal-backdrop" data-menu-modal-close></div>
        <article class="menu-modal-card">
          <button class="menu-modal-close" data-menu-modal-close type="button" aria-label="Yopish">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m18 6-12 12M6 6l12 12" />
            </svg>
          </button>
          <img class="menu-modal-image" id="menu-modal-image" alt="" decoding="async" />
          <div class="menu-modal-content">
            <h2 id="menu-modal-title"></h2>
            <p id="menu-modal-description"></p>
            <strong class="menu-modal-price" id="menu-modal-price"></strong>
            <div class="menu-modal-meta" id="menu-modal-meta"></div>
            <div class="menu-modal-variants" id="menu-modal-variants"></div>
            <div class="menu-modal-addons" id="menu-modal-addons"></div>
          </div>
        </article>
      </div>

      <section class="login-card is-hidden" id="login-panel" aria-label="Admin login">
        <div class="login-brand">
          <img src="/static/assets/bon-bon-logo.svg" alt="Bon Bon" />
          <div>
            <p class="eyebrow">Admin</p>
            <h1>Login</h1>
          </div>
        </div>

        <div class="admin-login is-hidden" id="admin-login">
          <label for="admin-login-name">Admin login</label>
          <input id="admin-login-name" type="text" placeholder="admin" autocomplete="username" />
          <label for="admin-key">Admin parol</label>
          <div class="admin-login-row">
            <input id="admin-key" type="password" placeholder="ADMIN_PASSWORD" autocomplete="current-password" />
            <button class="ghost-button" id="save-admin-key" type="button">
              Kirish
            </button>
          </div>
        </div>

        <p class="status" id="login-status">Admin login va parolni kiriting.</p>
      </section>

      <section class="admin-card is-hidden" id="admin-panel">
        <aside class="admin-sidebar" aria-label="Admin menu">
          <div class="admin-brand">
            <span class="admin-brand-mark" aria-hidden="true">
              <img src="/static/assets/bon-bon-logo.svg" alt="" />
            </span>
            <div>
              <strong>Bon-Bon</strong>
              <span>Admin</span>
            </div>
          </div>

          <div class="admin-sidebar-bottom" aria-label="Katalog boshqaruvi">
            <button class="admin-bottom-button" data-admin-view="categories" type="button">
              Categoriyalar
            </button>
            <button class="admin-bottom-button" data-admin-view="items" type="button">
              Itemlar
            </button>
            <button class="admin-bottom-button" data-admin-view="variants" type="button">
              Variantlar
            </button>
            <button class="admin-bottom-button" data-admin-view="addon-groups" type="button">
              Addon Grouplar
            </button>
            <button class="admin-bottom-button" data-admin-view="addons" type="button">
              Addonlar
            </button>
            <button class="admin-bottom-button" data-admin-view="addon-links" type="button">
              Group Addonlar
            </button>
          </div>
        </aside>

        <div class="admin-main">
          <div class="admin-heading">
            <div>
              <p class="eyebrow">Admin</p>
              <h2>Katalog boshqaruvi</h2>
            </div>
            <button class="admin-refresh-button" id="refresh-orders" type="button" aria-label="Joriy bo'limni yangilash">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4" />
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4" />
              </svg>
            </button>
          </div>

          <p class="status" id="admin-status">Admin panel tayyorlanmoqda.</p>
          <div class="orders-list" id="orders-list"></div>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=auth-login-page-1"></script>
  </body>
</html>
