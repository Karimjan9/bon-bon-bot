<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BonBon Cafe</title>

  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }

    .app-shell {
      max-width: 420px;
      margin: auto;
      padding: 15px;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: #38bdf8;
      font-size: 12px;
    }

    h1 {
      font-size: 20px;
      margin: 10px 0;
    }

    .lead {
      font-size: 13px;
      opacity: 0.8;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    select, input, textarea {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    .quantity-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #increment, #decrement {
      width: 40px;
      background: #334155;
      color: white;
    }

    .primary-button {
      margin-top: 15px;
      width: 100%;
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.7;
    }

    .admin-card {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<main class="app-shell">

  <!-- HERO -->
  <section class="hero">
    <p class="eyebrow">🍔 BonBon Cafe</p>
    <h1>Shirin va mazali buyurtmalarni tanlang</h1>
    <p class="lead">Telegram ichida tez va oson buyurtma bering 🚀</p>
  </section>

  <!-- ORDER CARD -->
  <section class="card">

    <label>Mahsulot</label>
    <select id="product">
      <option>🍔 Burger</option>
      <option>🍕 Pizza</option>
      <option>🍰 Tort</option>
      <option>☕ Coffee</option>
    </select>

    <label>Soni</label>
    <div class="quantity-row">
      <button id="decrement">-</button>
      <input id="quantity" type="number" value="1" min="1">
      <button id="increment">+</button>
    </div>

    <label>Izoh</label>
    <textarea id="note" placeholder="Masalan: achchiqsiz bo‘lsin"></textarea>

    <button class="primary-button" id="send-order">
      📲 Buyurtma yuborish
    </button>

  </section>

  <!-- ADMIN PANEL -->
  <section class="admin-card" id="admin-panel">
    <h2>Admin Panel</h2>
    <input type="password" id="admin-key" placeholder="ADMIN_KEY">
    <button id="save-admin-key">Kirish</button>
    <p class="status">Admin panel tayyorlanmoqda...</p>
  </section>

  <p class="status" id="status">BonBon tayyor 🍔</p>

</main>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const qty = document.getElementById("quantity");

  document.getElementById("increment").onclick = () => qty.value++;
  document.getElementById("decrement").onclick = () => {
    if (qty.value > 1) qty.value--;
  };

  document.getElementById("send-order").onclick = () => {
    const data = {
      product: document.getElementById("product").value,
      quantity: qty.value,
      note: document.getElementById("note").value
    };

    tg.sendData(JSON.stringify(data));
  };
</script>

</body>
</html>
