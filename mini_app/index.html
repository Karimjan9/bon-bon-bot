<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BonBon Cafe</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }

    .app-shell {
      max-width: 420px;
      margin: auto;
      padding: 15px;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero p {
      margin: 5px 0;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
    }

    select, input, textarea {
      width: 100%;
      margin-top: 5px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }

    .quantity-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 5px;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #increment, #decrement {
      width: 40px;
      background: #334155;
      color: white;
    }

    .primary-button {
      margin-top: 15px;
      width: 100%;
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<main class="app-shell">

  <!-- HERO -->
  <section class="hero">
    <p>🍔 BonBon Cafe</p>
    <h2>Shirin va mazali buyurtmalar</h2>
    <p>Telegram ichida tez buyurtma bering 🚀</p>
  </section>

  <!-- ORDER CARD -->
  <section class="card">

    <label>Mahsulot</label>
    <select id="product">
      <option>🍔 Burger</option>
      <option>🍕 Pizza</option>
      <option>🍰 Tort</option>
      <option>☕ Coffee</option>
    </select>

    <label>Soni</label>
    <div class="quantity-row">
      <button id="decrement">-</button>
      <input id="quantity" type="number" value="1" min="1">
      <button id="increment">+</button>
    </div>

    <label>Izoh</label>
    <textarea id="note" placeholder="Masalan: achchiqsiz bo‘lsin"></textarea>

    <button class="primary-button" id="send-order">
      📲 Buyurtma yuborish
    </button>

  </section>

  <p class="status" id="status">BonBon tayyor 🍔</p>

</main>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const qty = document.getElementById("quantity");

  document.getElementById("increment").onclick = () => {
    qty.value = Number(qty.value) + 1;
  };

  document.getElementById("decrement").onclick = () => {
    if (qty.value > 1) qty.value = Number(qty.value) - 1;
  };

  document.getElementById("send-order").onclick = () => {
    const data = {
      product: document.getElementById("product").value,
      quantity: Number(qty.value),
      note: document.getElementById("note").value
    };

    tg.sendData(JSON.stringify(data));

    document.getElementById("status").innerText =
      "Buyurtma yuborildi 🚀";
  };
</script>

</body>
</html>
